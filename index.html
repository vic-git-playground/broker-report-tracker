</script>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2537; --border:#2a3349;
    --text:#e8ecf6; --sub:#93a0bd; --accent:#4f8bff; --green:#33c17a; --red:#f0556b; --amber:#e5b95c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
  header{display:flex;align-items:center;gap:20px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:6px 10px;}
  .search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:15px;width:150px;}
  .search-box input::placeholder{color:var(--sub);}
  .search-box button{background:var(--accent);border:none;color:white;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px;}
  .search-box button:hover{opacity:.88;}
  .title{font-size:15px;color:var(--sub);}
  .title b{color:var(--text);font-size:17px;}
  .quicklist{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .quicklist span{background:var(--panel2);border:1px solid var(--border);color:var(--sub);padding:5px 10px;border-radius:16px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .quicklist span:hover{border-color:var(--accent);color:var(--text);}
  .layout{display:flex;gap:18px;padding:22px;max-width:1560px;margin:0 auto;align-items:flex-start;}
  main{flex:1;min-width:0;}
  .latest-panel{width:320px;flex:0 0 320px;position:sticky;top:16px;max-height:calc(100vh - 32px);
    overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 14px;}
  .latest-title{font-size:14px;font-weight:600;margin:0 0 4px;}
  .latest-sub{font-size:11.5px;color:var(--sub);margin-bottom:12px;}
  .latest-item{border-top:1px solid var(--border);padding:9px 2px;cursor:pointer;}
  .latest-item:first-of-type{border-top:none;}
  .latest-item:hover{background:rgba(255,255,255,.03);}
  .li-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--sub);}
  .li-name{font-size:13px;font-weight:600;margin-top:2px;}
  .li-broker{font-size:11.5px;color:var(--sub);margin-top:1px;}
  .li-tp{font-size:11.5px;margin-top:3px;}
  .li-body{margin-top:7px;padding:9px 10px;background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;font-size:12px;line-height:1.6;}
  .li-body ul{margin:4px 0 0;padding-left:16px;}
  .li-body li{margin-bottom:3px;}
  .li-none{color:var(--sub);font-size:11.5px;}
  @media (max-width:1200px){ .layout{flex-direction:column;} .latest-panel{width:auto;flex:none;position:static;max-height:none;} }
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:18px;}
  .company-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;}
  .company-head h1{margin:0;font-size:24px;}
  .company-head .code{color:var(--sub);font-size:14px;margin-top:2px;}
  .sector-tag{display:inline-block;margin-top:8px;background:rgba(79,139,255,.15);color:#8fb4ff;padding:3px 10px;border-radius:6px;font-size:12px;}
  .stat-row{display:flex;gap:26px;flex-wrap:wrap;}
  .stat{min-width:96px;}
  .stat .label{font-size:12px;color:var(--sub);}
  .stat .value{font-size:20px;font-weight:600;margin-top:2px;}
  .up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--sub);}
  .section-title{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--text);display:flex;align-items:center;gap:8px;}
  .section-title .hint{font-size:12px;color:var(--sub);font-weight:400;}
  canvas{max-height:320px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left;}
  th{color:var(--sub);font-weight:500;font-size:12px;}
  tr:hover td{background:rgba(255,255,255,.02);}
  .rating{padding:2px 8px;border-radius:6px;font-size:12px;}
  .rating.buy{background:rgba(51,193,122,.15);color:var(--green);}
  .rating.hold{background:rgba(229,185,92,.15);color:var(--amber);}
  .rating.other{background:rgba(147,160,189,.15);color:var(--sub);}
  .delta{font-size:11px;margin-left:4px;}
  .broker-cell{font-weight:600;}
  .note{color:var(--sub);font-size:12.5px;max-width:280px;white-space:normal;text-align:left;}
  th.col-tp,td.col-tp{width:96px;min-width:96px;padding-left:4px;padding-right:4px;font-size:12.5px;}
  th.col-note,td.col-note{width:440px;min-width:440px;max-width:440px;}
  .filename{color:var(--sub);font-size:11.5px;white-space:normal;text-align:left;max-width:230px;word-break:break-all;font-family:Consolas,"Courier New",monospace;}
  .empty{color:var(--sub);padding:40px;text-align:center;}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:20px;}
  .badge-new{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle;}
  .controls-card{padding:12px 16px;}
  .controls-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;}
  .seg button{background:transparent;border:none;color:var(--sub);padding:6px 14px;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit;}
  .seg button.active{background:var(--accent);color:#fff;}
  .seg button:hover:not(.active){color:var(--text);}
  td.estq{color:var(--sub);}
  .broker-picker{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .broker-picker-label{font-size:13px;color:var(--sub);}
  .broker-picker select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit;max-width:260px;}
  .focus-card{border:1px solid rgba(79,139,255,.4);background:linear-gradient(180deg, rgba(79,139,255,.08), var(--panel));}
  .focus-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .focus-badge{background:var(--accent);color:#fff;font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600;}
  .focus-broker{font-size:17px;font-weight:700;}
  .focus-date{color:var(--sub);font-size:13px;}
  .focus-vs{color:var(--sub);font-size:12.5px;margin-left:auto;}
  .focus-body{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;}
  .focus-block{min-width:120px;}
  .focus-blocklabel{font-size:12px;color:var(--sub);margin-bottom:4px;}
  .focus-blockval{font-size:19px;font-weight:600;}
  .focus-blockbase{font-size:12px;color:var(--sub);margin-top:3px;}
  .focus-yeargrid{display:flex;gap:16px;flex-wrap:wrap;flex:1;}
  .focus-yearcell{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:110px;}
  .focus-yearlabel{font-size:11px;color:var(--sub);}
  .focus-yearval{font-size:18px;font-weight:700;margin-top:2px;}

  "2408": {
    "name": "南亞科",
    "nameEn": "NTC",
    "sector": "半導體/DRAM記憶體",
    "reports": [
      {
        "broker": "Nanya Technology Corporation (3DIC Division)",
        "date": "2024-01-01",
        "rating": "其他",
        "ratingCn": "本文件為技術研討會論文，非證券研究報告，無投資評等",
        "price": null,
        "tp": null,
        "tpPrev": null,
        "annual": {},
        "quarterly": [],
        "note": "本文為南亞科技3DIC部門發表之技術論文，內容為低溫混合鍵合(Hybrid Bonding)製程優化，用於超寬I/O AI DRAM堆疊技術，非財務分析報告，無營收、獲利或股價相關數據。",
        "summary": {
          "thesis_bullets": [
            "AI應用對頻寬需求大增，導致記憶體牆(Memory Wall)問題，超寬I/O(UWIO) DRAM可透過加寬資料匯流排而非提高資料速率來提升頻寬，特別適合AI應用",
            "高密度混合鍵合(HD Hybrid Bonding)面臨挑戰：傳統350-400°C的鍵合後退火(PBA)製程可能損害DRAM可靠性，且隨銅圖案密度增加，CMP滾降(roll-off)風險更高",
            "本研究透過系統性優化CMP參數、SiCN的C-N鍵結、銅圖案密度與排隊時間(Queue Time)控制，成功開發出300°C低溫混合鍵合製程",
            "透過C-SAM/AFM分析達成99.9%良率，SEM/TEM截面與電性量測證實介面無缺陷，12吋晶圓中超過99%樣本的累積電阻低於500mΩ/link",
            "此製程提供可重複、低熱預算(low-thermal-budget)的解決方案，適用於次世代DRAM堆疊技術"
          ],
          "outline": [
            {
              "heading": "1. Introduction (前言)",
              "bullets": [
                "AI應用優先考慮平行運算而非傳統運算，增加對更高頻寬的需求，UWIO(超寬I/O)可解決記憶體牆問題"
              ],
              "subsections": [
                {
                  "heading": "Ultra-Wide I/O AI DRAM 之動機",
                  "bullets": [
                    "LLM參數規模擴張帶動硬體峰值FLOPS與記憶體/互連頻寬的擴展需求，出現記憶體牆瓶頸"
                  ]
                },
                {
                  "heading": "DRAM晶粒效能擴展趨勢",
                  "bullets": [
                    "UWIO透過拓寬資料匯流排而非提升資料速率來提升頻寬，適合AI應用；HBM4約8K I/O可達3TB/s頻寬，HBM4E約2.5TB/s"
                  ]
                },
                {
                  "heading": "UWIO的優勢",
                  "bullets": [
                    "具備更高頻寬與效能、降低延遲、降低功耗，有助於系統層級優化，但面臨3D堆疊的散熱效率挑戰"
                  ]
                },
                {
                  "heading": "高密度混合鍵合(HD HB)挑戰",
                  "bullets": [
                    "需優化CMP、介電材料選擇與鍵合後退火溫度；450°C PBA可達高良率但有DRAM可靠性風險；SiCN可實現200°C PBA，但隨密度增加CMP滾降風險上升"
                  ]
                }
              ]
            },
            {
              "heading": "2. Fabrication Process (製程流程)",
              "bullets": [
                "透過晶圓對晶圓(WoW)介電質與銅鍵合實驗矩陣，測試SiCN沉積參數、鍵合墊光刻蝕刻條件、銅電鍍、CMP、預鍵合清潔與排隊時間等變因"
              ],
              "subsections": [
                {
                  "heading": "HB製程流程",
                  "bullets": [
                    "利用懸鍵(Dangling bonds)增強親水性以形成凡得瓦力鍵合，再透過退火形成共價鍵",
                    "流程包含電漿活化、親水鍵合、鍵合後退火(PBA)、探針測試菊鏈結構與TSV",
                    "利用CTE(熱膨脹係數)差異提升Cu-Cu鍵合時的鍵合壓力，使銅鍵合可在低溫下進行"
                  ]
                }
              ]
            },
            {
              "heading": "3. Results and Discussion (結果與討論)",
              "bullets": [],
              "subsections": [
                {
                  "heading": "SiCN介電質C-N鍵結強度",
                  "bullets": [
                    "Si-N與C-N鍵形成有助於提升薄膜潤濕性，控制C-N密度可改善鍵合品質"
                  ]
                },
                {
                  "heading": "銅圖案密度製程窗口",
                  "bullets": [
                    "銅密度變化顯著影響鍵合表現，需平衡CMP滾降與鍵合品質"
                  ]
                },
                {
                  "heading": "CMP製程優化",
                  "bullets": [
                    "不同拋光配方導致SiCN-Cu滾降與Cu凹陷(dishing)程度不同，皆會影響鍵合表現"
                  ]
                },
                {
                  "heading": "排隊時間(Queue Time)控制",
                  "bullets": [
                    "表面顆粒與老化會影響鍵合品質；透過管理排隊時間控制與優化CMP參數、強化SiCN C-N鍵、微調銅圖案密度，共同提升鍵合品質與重現性"
                  ]
                },
                {
                  "heading": "電性與截面分析",
                  "bullets": [
                    "在300°C PBA條件下，每晶圓菊鏈良率達99%以上(254k links)，電阻小於500mΩ/link",
                    "SEM/TEM截面與EDS分析驗證介面無缺陷"
                  ]
                }
              ]
            },
            {
              "heading": "4. Conclusion (結論)",
              "bullets": [
                "混合鍵合可達近1µm超細間距與優異熱表現，標準350-400°C退火會有DRAM可靠性風險；本研究透過系統性優化CMP參數、SiCN C-N鍵結、銅圖案密度與排隊時間控制，展示300°C混合鍵合製程",
                "透過C-SAM/AFM分析達成99.9%良率，SEM/TEM截面與電性量測證實12吋晶圓中無缺陷介面，超過99%樣本累積電阻低於500mΩ/link",
                "此結果提供可重複、低熱預算的次世代DRAM堆疊解決方案"
              ],
              "subsections": []
            }
          ]
        },
        "sourceFile": "260501_VLSI_AI DRAM Stacking.pdf"
      }
    ]

// ---------------- 狀態 ----------------
let chart1 = null, chart2 = null;
let currentCode = "2308";
let period = "annual";   // 'annual' | 'quarterly'
let metric = "eps";      // 'eps' | 'revenue' | 'gm'
let selectedBroker = "all"; // 'all' 或特定券商名稱

const METRIC_META = {
  eps:     { label:"EPS",     unit:"NT$/股", short:"EPS",    btn:"EPS" },
  revenue: { label:"營收",    unit:"NT$十億元", short:"營收",  btn:"營收" },
  gm:      { label:"毛利率",  unit:"%", short:"毛利率",       btn:"毛利率" },
  opm:     { label:"營業利益率", unit:"%", short:"營益率",    btn:"營業利益率" },
  npm:     { label:"淨利率",  unit:"%", short:"淨利率",       btn:"淨利率" }
};
// 依實際資料動態決定要顯示哪些指標按鈕：如果目前這檔股票所有報告都完全沒有 opm/npm 資料，
// 就不顯示該按鈕，避免使用者切過去看到整片空白
function availableMetrics(reports){
  const keys = Object.keys(METRIC_META);
  return keys.filter(k=>{
    if(k==="eps"||k==="revenue"||k==="gm") return true; // 核心三項一律顯示
    return reports.some(r=> (r.annual[k] && Object.keys(r.annual[k]).length) ||
                             (r.quarterly||[]).some(q=>q[k]!==undefined));
  });
}

// ---------------- 工具 ----------------
function ratingClass(r){
  if(/買|增加持股|Buy|Overweight/i.test(r)) return "buy";
  if(/中立|持有|Hold|Neutral/i.test(r)) return "hold";
  return "other";
}
function fmt(n){ return (n===undefined||n===null) ? "—" : n.toLocaleString("en-US",{maximumFractionDigits:2}); }
function pct(a,b){
  if(a===undefined||b===undefined||a===null||b===null||b===0) return null;
  return ((a-b)/Math.abs(b))*100;
}
function deltaSpan(a,b){
  const p = pct(a,b);
  if(p===null) return "";
  if(Math.abs(p)<0.05) return ` <span class="delta flat">（持平）</span>`;
  const cls = p>0 ? "up" : "down";
  const sign = p>0 ? "▲" : "▼";
  return ` <span class="delta ${cls}">${sign}${Math.abs(p).toFixed(1)}%</span>`;
}
// 依 metric 取得單一年度數值（revenue 自動換算為十億元）
function annualVal(rep, y){
  const raw = rep.annual[metric] ? rep.annual[metric][y] : undefined;
  if(raw===undefined) return undefined;
  return metric==="revenue" ? raw/1000 : raw;
}
function annualPrevVal(rep, y){
  if(metric!=="eps") return undefined; // 只有 EPS 有完整前次估值紀錄
  return rep.annual.epsPrev ? rep.annual.epsPrev[y] : undefined;
}
function quarterKey(q){ return q.year*10 + q.q; }
function quarterLabel(q){ return `${q.q}Q${String(q.year).slice(2)}${q.actual?'':'F'}`; }
function quarterVal(qObj){
  const raw = qObj[metric];
  if(raw===undefined) return null;
  return metric==="revenue" ? raw/1000 : raw;
}
function parsePrevRatingLabel(ratingCn){
  const m = ratingCn.match(/原[:：]\s*([^)]+)\)/);
  return m ? m[1].trim() : null;
}

// 重點摘要：三階段拆解架構（第一階段：總大論點＋核心表達意圖／第二階段：結構化大綱）
// 若該份報告尚未有結構化摘要（summary 為空），回傳空字串，畫面上只會顯示原本的一句話 note。
function summaryDetailHtml(rep){
  const s = rep.summary;
  const hasThesis = s && s.thesis_bullets && s.thesis_bullets.length;
  const hasOutline = s && s.outline && s.outline.length;
  if(!s || (!hasThesis && !hasOutline && !s.core_intent)) return "";

  const thesisHtml = hasThesis ? `<ul class="summary-thesis">${s.thesis_bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : "";

  const outlineHtml = hasOutline ? s.outline.map(sec=>{
    const bulletsHtml = (sec.bullets||[]).length ? `<ul>${sec.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : "";
    const subHtml = (sec.subsections||[]).map(sub=>`
      <div class="outline-sub">
        <div class="outline-subhead">${sub.heading||""}</div>
        <ul>${(sub.bullets||[]).map(b=>`<li>${b}</li>`).join("")}</ul>
      </div>`).join("");
    return `<div class="outline-sec">
      <div class="outline-head">${sec.heading||""}</div>
      ${bulletsHtml}
      ${subHtml}
    </div>`;
  }).join("") : "";

  return `<details class="summary-detail">
    <summary>📄 查看核心論點</summary>
    <div class="summary-block">
      ${s.core_intent ? `<div class="summary-stage"><b>核心表達意圖</b><div class="summary-intent">${s.core_intent}</div></div>` : ""}
      ${thesisHtml ? `<div class="summary-stage"><b>核心論點</b>${thesisHtml}</div>` : ""}
      ${outlineHtml ? `<div class="summary-stage"><b>報告結構</b><div class="summary-outline">${outlineHtml}</div></div>` : ""}
    </div>
  </details>`;
}

function buildQuicklist(){
  // 頂端不再列出所有代號（數量一多會很雜亂），改為只靠搜尋列輸入。
  // 仍建立 datalist，讓輸入框有自動完成提示。
  const dl = document.getElementById("tickerList");
  Object.keys(DATA).forEach(code=>{
    const opt = document.createElement("option");
    opt.value = code; opt.label = DATA[code].name;
    dl.appendChild(opt);
  });
}

function go(){
  const v = document.getElementById("tickerInput").value.trim();
  if(DATA[v]) render(v);
  else {
    const found = Object.keys(DATA).find(c=> DATA[c].name.includes(v) || DATA[c].nameEn.toLowerCase().includes(v.toLowerCase()));
    if(found) render(found);
    else renderEmpty(v);
  }
}

function renderEmpty(q){
  document.getElementById("hdrCompany").textContent = "Demo";
  document.getElementById("main").innerHTML = `<div class="card empty">查無「${q}」的追蹤報告。目前收錄個股：${Object.keys(DATA).map(c=>c+" "+DATA[c].name).join("、")}</div>`;
}

function setPeriod(p){ period = p; render(currentCode); }
function setMetric(m){ metric = m; render(currentCode); }
function setBroker(b){ selectedBroker = b; render(currentCode); }

// 券商聚焦卡片：該券商「最新一份報告」vs「上一次估值」
// 上一次估值優先取自該券商在同一檔股票的前一份實際報告；若該券商僅有一份報告，
// 則退而使用該份報告內文揭露的前次預估（例如「上修至X元，原估Y元」）。
function brokerFocusHtml(allReports){
  const brokerReports = allReports.filter(r=>r.broker===selectedBroker).sort((a,b)=>a.date.localeCompare(b.date));
  if(brokerReports.length===0) return "";
  const latest = brokerReports[brokerReports.length-1];
  const prev = brokerReports.length>=2 ? brokerReports[brokerReports.length-2] : null;

  const years = Array.from(new Set(Object.keys(latest.annual.eps||{}).map(Number))).sort((a,b)=>a-b);
  const latestYear = new Date(latest.date).getFullYear();

  const tpBase = prev ? prev.tp : latest.tpPrev;
  const tpBaseHtml = (tpBase===null) ? `<span class="badge-new">首次覆蓋，無前次目標價</span>`
    : (tpBase===undefined ? `—` : `前次 NT$${fmt(tpBase)}${deltaSpan(latest.tp, tpBase)}`);

  const prevRatingLabel = prev ? prev.ratingCn : parsePrevRatingLabel(latest.ratingCn);
  const ratingChanged = !!prevRatingLabel && prevRatingLabel !== latest.ratingCn;

  const yearCells = years.map(y=>{
    const cur = annualVal(latest, y);
    if(cur===undefined) return "";
    const base = prev ? annualVal(prev,y) : annualPrevVal(latest,y);
    const label = `${y}${y<=latestYear-1?'A':'E'}`;
    const curTxt = `${fmt(metric==="gm"?cur.toFixed(1):cur)}${metric==="gm"?"%":""}`;
    const baseTxt = base!==undefined ? `前次 ${fmt(metric==="gm"?base.toFixed(1):base)}${metric==="gm"?"%":""}${deltaSpan(cur,base)}` : `（無前次資料）`;
    return `<div class="focus-yearcell">
      <div class="focus-yearlabel">${label} ${METRIC_META[metric].short}</div>
      <div class="focus-yearval">${curTxt}</div>
      <div class="focus-yearbase">${baseTxt}</div>
    </div>`;
  }).join("");

  return `<div class="card focus-card">
    <div class="focus-header">
      <span class="focus-badge">最新報告聚焦</span>
      <span class="focus-broker">${latest.broker}</span>
      <span class="focus-date">${latest.date}</span>
      <span class="focus-vs">${prev ? `vs 上一次報告（${prev.date}）` : (prevRatingLabel ? "前次評等/估值取自本份報告內文揭露" : "此為該券商目前唯一一份追蹤報告，無前次估值可比較")}</span>
    </div>
    <div class="focus-body">
      <div class="focus-block">
        <div class="focus-blocklabel">評等</div>
        <div class="focus-blockval"><span class="rating ${ratingClass(latest.rating)}">${latest.ratingCn}</span></div>
        <div class="focus-blockbase">${prevRatingLabel ? `前次：${prevRatingLabel}${ratingChanged?' <span class="delta up">已調整</span>':''}` : "—"}</div>
      </div>
      <div class="focus-block">
        <div class="focus-blocklabel">目標價</div>
        <div class="focus-blockval">NT$${fmt(latest.tp)}</div>
        <div class="focus-blockbase">${tpBaseHtml}</div>
      </div>
      <div class="focus-yeargrid">${yearCells}</div>
    </div>
    <div class="focus-note"><b>本次摘要：</b>${latest.note}${summaryDetailHtml(latest)}</div>
    ${prev ? `<div class="focus-note prev"><b>上一次摘要（${prev.date}）：</b>${prev.note}${summaryDetailHtml(prev)}</div>` : ""}
  </div>`;
}

function render(code){
  const c = DATA[code];
  if(!c) return renderEmpty(code);
  const tickerChanged = currentCode !== code;
  currentCode = code;
  if(tickerChanged) selectedBroker = "all";
  document.getElementById("tickerInput").value = code;
  document.getElementById("hdrCompany").textContent = `${c.name} (${code})`;

  const allReports = [...c.reports].sort((a,b)=> a.date.localeCompare(b.date));
  const brokerOrder = [];
  [...allReports].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{ if(!brokerOrder.includes(r.broker)) brokerOrder.push(r.broker); });
  if(selectedBroker!=="all" && !brokerOrder.includes(selectedBroker)) selectedBroker = "all";

  const reports = selectedBroker==="all" ? allReports : allReports.filter(r=>r.broker===selectedBroker);
  const latest = reports[reports.length-1];
  const latestAll = allReports[allReports.length-1];
  const avgTpAll = allReports.reduce((s,r)=>s+r.tp,0)/allReports.length;
  const upsideAll = pct(avgTpAll, latestAll.price);
  const availMetrics = availableMetrics(allReports);
  if(!availMetrics.includes(metric)) metric = "eps";
  const mm = METRIC_META[metric];

  // 年度集合（跨所有報告聯集）
  const years = Array.from(new Set(reports.flatMap(r=>Object.keys(r.annual.eps||{}).map(Number)))).sort((a,b)=>a-b);
  // 季度集合（跨所有報告聯集）
  const qUnion = [];
  const qSeen = new Set();
  reports.forEach(r=>{
    (r.quarterly||[]).forEach(q=>{
      const k = quarterKey(q);
      if(!qSeen.has(k)){ qSeen.add(k); qUnion.push(q); }
    });
  });
  qUnion.sort((a,b)=> quarterKey(a)-quarterKey(b));

  let html = "";

  html += `<div class="card">
    <div class="company-head">
      <div>
        <h1>${c.name} <span class="code">${code} · ${c.nameEn}</span></h1>
        <span class="sector-tag">${c.sector}</span>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="label">最新股價</div><div class="value">NT$${fmt(latestAll.price)}</div></div>
        <div class="stat"><div class="label">平均目標價 (${allReports.length}家)</div><div class="value">NT$${fmt(avgTpAll.toFixed(0))}</div></div>
        <div class="stat"><div class="label">隱含上行空間</div><div class="value ${upsideAll>=0?'up':'down'}">${upsideAll===null?'—':(upsideAll>=0?'+':'')+upsideAll.toFixed(1)+'%'}</div></div>
        <div class="stat"><div class="label">追蹤報告數</div><div class="value">${allReports.length}</div></div>
      </div>
    </div>
  </div>`;

  // 控制列：年度／季度 + EPS／營收／毛利率 + 券商篩選
  html += `<div class="card controls-card">
    <div class="controls-row">
      <div class="seg" id="segPeriod">
        <button class="${period==='annual'?'active':''}" onclick="setPeriod('annual')">年度</button>
        <button class="${period==='quarterly'?'active':''}" onclick="setPeriod('quarterly')">季度</button>
      </div>
      <div class="seg" id="segMetric">
        ${availMetrics.map(k=>`<button class="${metric===k?'active':''}" onclick="setMetric('${k}')">${METRIC_META[k].btn}</button>`).join("")}
      </div>
      <div class="broker-picker">
        <span class="broker-picker-label">券商：</span>
        <select onchange="setBroker(this.value)">
          <option value="all" ${selectedBroker==='all'?'selected':''}>全部券商（比較總覽）</option>
          ${brokerOrder.map(b=>`<option value="${b}" ${selectedBroker===b?'selected':''}>${b}</option>`).join("")}
        </select>
      </div>
    </div>
  </div>`;

  // 券商聚焦卡片：最新報告 vs 上一次估值
  if(selectedBroker!=="all"){
    html += brokerFocusHtml(allReports);
  }

  // 主圖表
  html += `<div class="card">
    <div class="section-title">各券商 ${mm.label} ${period==='annual'?'年度':'季度'}預估比較 <span class="hint">單位：${mm.unit}</span></div>
    <canvas id="epsChart"></canvas>
  </div>`;

  // 目標價變化 (若同一股票有多份報告)
  if(reports.length>1){
    html += `<div class="card">
      <div class="section-title">目標價動態追蹤 <span class="hint">依報告發布日期排序</span></div>
      <canvas id="tpChart"></canvas>
    </div>`;
  }

  // 明細表
  if(period==="annual"){
    // 明細表只列「去年 ~ 後年」共四個年度（以最新一份報告的年份為基準），
    // 更早的歷史年度已無決策意義，且會讓表格過寬；上方圖表仍保留完整年度供比較。
    const anchorYear = new Date(latest.date).getFullYear();
    const tableYears = years.filter(y=> y>=anchorYear-1 && y<=anchorYear+2);
    html += `<div class="card">
      <div class="section-title">券商報告明細 <span class="hint">${metric==="revenue"?"營收數值請見上方圖表，此表僅列評等／目標價／摘要":`年度 ${mm.label}`}</span></div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr>
          <th>發布日期</th><th>券商</th><th>評等</th><th class="col-tp">目標價</th>
          ${metric==="revenue" ? "" : tableYears.map(y=>`<th>${y}${y<=anchorYear-1?'A':'E'} ${mm.short}</th>`).join("")}
          <th class="col-note">重點摘要</th>
          <th>報告檔名</th>
        </tr></thead>
        <tbody>
        ${reports.map(r=>{
          const tpDelta = r.tpPrev && r.tpPrev!==r.tp ? deltaSpan(r.tp, r.tpPrev) : (r.tpPrev===null ? ' <span class="badge-new">首次</span>' : '');
          return `<tr>
            <td>${r.date}</td>
            <td class="broker-cell">${r.broker}</td>
            <td><span class="rating ${ratingClass(r.rating)}">${r.ratingCn}</span></td>
            <td class="col-tp">NT$${fmt(r.tp)}${tpDelta}</td>
            ${metric==="revenue" ? "" : tableYears.map(y=>{
              const v = annualVal(r,y);
              if(v===undefined) return `<td>—</td>`;
              const prevV = annualPrevVal(r,y);
              return `<td>${fmt(metric==="gm"?v.toFixed(1):v)}${metric==="gm"?"%":""}${prevV!==undefined?deltaSpan(v,prevV):''}</td>`;
            }).join("")}
            <td class="note col-note">${r.note}${summaryDetailHtml(r)}</td>
            <td class="filename">${r.sourceFile||"—"}</td>
          </tr>`;
        }).join("")}
        </tbody>
      </table>
      </div>
    </div>`;
  } else {
    html += `<div class="card">
      <div class="section-title">券商報告明細 <span class="hint">${metric==="revenue"?"營收數值請見上方圖表，此表僅列報告檔名":`單季 ${mm.label}，灰色為報告發布時尚未公布之預估季`}</span></div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr>
          <th>券商</th><th>發布日期</th>
          ${metric==="revenue" ? "" : qUnion.map(q=>`<th>${quarterLabel(q)}</th>`).join("")}
          <th>報告檔名</th>
        </tr></thead>
        <tbody>
        ${reports.map(r=>{
          const byKey = {};
          (r.quarterly||[]).forEach(q=> byKey[quarterKey(q)] = q);
          const fileCell = `<td class="filename">${r.sourceFile||"—"}</td>`;
          const hasAny = (r.quarterly||[]).some(q=> q[metric]!==undefined);
          if(metric!=="revenue" && !hasAny){
            return `<tr><td class="broker-cell">${r.broker}</td><td>${r.date}</td><td colspan="${qUnion.length}" class="note">此券商報告未揭露單季${mm.label}預估</td>${fileCell}</tr>`;
          }
          return `<tr>
            <td class="broker-cell">${r.broker}</td><td>${r.date}</td>
            ${metric==="revenue" ? "" : qUnion.map(q=>{
              const rq = byKey[quarterKey(q)];
              if(!rq || rq[metric]===undefined) return `<td>—</td>`;
              const v = quarterVal(rq);
              return `<td class="${rq.actual?'':'estq'}">${fmt(metric==="gm"?v.toFixed(1):v)}${metric==="gm"?"%":""}</td>`;
            }).join("")}
            ${fileCell}
          </tr>`;
        }).join("")}
        </tbody>
      </table>
      </div>
    </div>`;
  }

  document.getElementById("main").innerHTML = html;

  // ---------------- 畫圖 ----------------
  const palette = ["#4f8bff","#33c17a","#e5b95c","#f0556b","#a367e0","#39c0d8","#ff9f5a","#7bd389","#5ac8fa"];

  try{
    if(typeof Chart === "undefined") throw new Error("Chart.js 未載入");
    if(chart1) chart1.destroy();

    if(period==="annual"){
      const datasets = years.map((y,i)=>({
        label: `${y}年 ${mm.short}`,
        data: reports.map(r=> { const v = annualVal(r,y); return v===undefined?null:v; }),
        backgroundColor: palette[i % palette.length]
      }));
      chart1 = new Chart(document.getElementById("epsChart"), {
        type:"bar",
        data:{ labels: reports.map(r=> reports.length>1 ? `${r.broker} (${r.date.slice(2)})` : r.broker), datasets },
        options:{
          responsive:true,
          plugins:{ legend:{labels:{color:"#e8ecf6"}}, tooltip:{mode:"index", intersect:false} },
          scales:{
            x:{ ticks:{color:"#93a0bd", maxRotation:35, minRotation:0}, grid:{color:"#2a3349"} },
            y:{ ticks:{color:"#93a0bd"}, grid:{color:"#2a3349"}, title:{display:true,text:mm.unit,color:"#93a0bd"} }
          }
        }
      });
    } else {
      const datasets = reports.map((r,i)=>{
        const byKey = {};
        (r.quarterly||[]).forEach(q=> byKey[quarterKey(q)] = q);
        return {
          label: `${r.broker} (${r.date.slice(2)})`,
          data: qUnion.map(q=>{
            const rq = byKey[quarterKey(q)];
            if(!rq) return null;
            return quarterVal(rq);
          }),
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          spanGaps:false,
          tension:0.2,
          pointRadius:3
        };
      });
      chart1 = new Chart(document.getElementById("epsChart"), {
        type:"line",
        data:{ labels: qUnion.map(q=>quarterLabel(q)), datasets },
        options:{
          responsive:true,
          plugins:{ legend:{labels:{color:"#e8ecf6"}}, tooltip:{mode:"index", intersect:false} },
          scales:{
            x:{ ticks:{color:"#93a0bd", maxRotation:35, minRotation:0}, grid:{color:"#2a3349"} },
            y:{ ticks:{color:"#93a0bd"}, grid:{color:"#2a3349"}, title:{display:true,text:mm.unit,color:"#93a0bd"} }
          }
        }
      });
    }
  } catch(e){
    const el = document.getElementById("epsChart");
    if(el) el.outerHTML = `<div class="empty">圖表載入失敗（${e.message}），請改用下方表格查看數據。</div>`;
  }

  if(reports.length>1){
    try{
      if(typeof Chart === "undefined") throw new Error("Chart.js 未載入");
      if(chart2) chart2.destroy();
      chart2 = new Chart(document.getElementById("tpChart"), {
        type:"bar",
        data:{
          labels: reports.map(r=> `${r.date}\n${r.broker}`),
          datasets:[
            { label:"目標價", data: reports.map(r=>r.tp), backgroundColor: reports.map((r,i)=>palette[i % palette.length]) }
          ]
        },
        options:{
          responsive:true,
          plugins:{ legend:{display:false}, tooltip:{mode:"index", intersect:false} },
          scales:{
            x:{ ticks:{color:"#93a0bd", maxRotation:35}, grid:{color:"#2a3349"} },
            y:{ ticks:{color:"#93a0bd"}, grid:{color:"#2a3349"}, title:{display:true,text:"NT$",color:"#93a0bd"} }
          }
        }
      });
    } catch(e){
      const el = document.getElementById("tpChart");
      if(el) el.outerHTML = `<div class="empty">圖表載入失敗（${e.message}），請改用下方表格查看數據。</div>`;
    }
  }
}

// ---------------- 右側「最新報告」面板 ----------------
let openReport = null;   // 目前展開中的報告 key

function allReportsSorted(){
  const out = [];
  Object.keys(DATA).forEach(code=>{
    (DATA[code].reports||[]).forEach((r,i)=>{
      out.push({code, name:DATA[code].name, idx:i, r});
    });
  });
  // 依報告日期新到舊
  out.sort((a,b)=> (b.r.date||"").localeCompare(a.r.date||""));
  return out;
}

function toggleReport(key){
  openReport = (openReport===key) ? null : key;
  buildLatestPanel();
}

function buildLatestPanel(){
  const el = document.getElementById("latestPanel");
  if(!el) return;
  const list = allReportsSorted().slice(0, 60);
  const rows = list.map(({code,name,idx,r})=>{
    const key = code+"#"+idx;
    const open = openReport===key;
    const tpDelta = (r.tpPrev && r.tpPrev!==r.tp) ? deltaSpan(r.tp, r.tpPrev)
                  : (r.tpPrev===null ? ' <span class="badge-new">首次</span>' : '');
    const bullets = (r.summary && r.summary.thesis_bullets) || [];
    const body = open ? `<div class="li-body">
        ${bullets.length ? `<ul>${bullets.map(b=>`<li>${b}</li>`).join("")}</ul>`
                         : (r.note ? r.note : `<span class="li-none">這份報告沒有摘要資料</span>`)}
        <div style="margin-top:8px"><a href="#" onclick="event.preventDefault();event.stopPropagation();document.getElementById('tickerInput').value='${code}';render('${code}');window.scrollTo({top:0,behavior:'smooth'});"
          style="color:var(--accent);font-size:11.5px;">→ 查看 ${code} 完整追蹤</a></div>
      </div>` : "";
    return `<div class="latest-item" onclick="toggleReport('${key}')">
      <div class="li-top"><span>${r.date||""}</span><span class="rating ${ratingClass(r.rating)}">${r.ratingCn||r.rating||""}</span></div>
      <div class="li-name">${code} ${name}</div>
      <div class="li-broker">${r.broker||""}</div>
      <div class="li-tp">目標價 NT$${fmt(r.tp)}${tpDelta}</div>
      ${body}
    </div>`;
  }).join("");
  el.innerHTML = `<div class="latest-title">📰 最新報告</div>
    <div class="latest-sub">依發布日期排序，點一下看重點</div>${rows}`;
}

// 初始化
buildQuicklist();
buildLatestPanel();
document.getElementById("tickerInput").addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
render("2308");

</script>
